[package]
name = "los-checker"
version = "0.1.0"
edition = "2024"

[dependencies]
image = "0.25.10"
rayon = "1.11.0"
num-traits = "0.2.19"
tiff = "0.11.3"
indicatif = { version = "0.18.4", features = ["rayon"] }
dialoguer = "0.12.0"
humansize = "2.1.3"
reqwest = "0.13.2"
serde = { version = "1.0.228", features = ["derive"] }
csv = "1.4.0"
clap = { version = "4.6.0", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }

[profile.optimized]
inherits = "release"
codegen-units = 1
lto = "fat"
panic = "abort"
debug = false

[profile.release]
debug = true

[profile.dev]
opt-level = 1
